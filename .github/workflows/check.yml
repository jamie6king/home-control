name: Check code
on:
    push:
    schedule:
          - cron: 0 2 * * *

jobs:
    changed:
        name: Check changed files
        runs-on: ubuntu-slim

        if: github.event_name == 'push'

        permissions:
            contents: read

        outputs:
            actions: ${{ steps.files.outputs.actions_any_changed }}
            code: ${{ steps.files.outputs.code_any_changed }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 2

            - name: Find changed files
              id: files
              uses: tj-actions/changed-files@v47
              with:
                  files_yaml: |
                      actions:
                          - ".github/workflows/*.yml"
                      code:
                          - "**/*.{ts,tsx,js,mjs,cjs,json}"

    analyse-actions:
        name: Analyse actions
        runs-on: ubuntu-slim
        needs: changed
        if: ${{ always() && (github.event_name == 'schedule' || needs.changed.outputs.actions == 'true') }}

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: actions
                  build-mode: none

            - name: Analyse actions
              uses: github/codeql-action/analyze@v4
              with:
                  category: /language:actions

    analyse-code:
        name: Analyse code
        runs-on: ubuntu-latest
        needs: changed
        if: ${{ always() && (github.event_name == 'schedule' || needs.changed.outputs.code == 'true') }}

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  build-mode: none

            - name: Analyse code
              uses: github/codeql-action/analyze@v4
              with:
                  category: /language:javascript-typescript

    analyse-deps:
        name: Analyse dependencies
        runs-on: ubuntu-slim
        if: github.event_name == 'push'

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Audit dependencies
              run: npm audit --include=dev

    test:
        name: Test code
        runs-on: ubuntu-latest
        needs:
            - changed
            - analyse-deps
        if: needs.changed.outputs.code == 'true'

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Install dependencies
              run: npm ci --include=dev

            - name: Run tests
              run: npm run test

    lint:
        name: Lint code
        runs-on: ubuntu-latest
        needs:
            - changed
            - analyse-deps
        if: needs.changed.outputs.code == 'true'

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Install dependencies
              run: npm ci --include=dev

            - parallel:
                  - name: Run linting
                    run: npm run lint

                  - name: Run type checking
                    run: npm run typecheck

                  - name: Run import checking
                    run: npm run importcheck
