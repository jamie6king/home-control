name: Check code
on: push

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyse:
        name: Analyse ${{ matrix.name }}
        runs-on: ubuntu-slim

        permissions:
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: actions
                      language: actions

                    - name: Typescript
                      language: javascript-typescript

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none

            - name: Analyse ${{ matrix.name }}
              uses: github/codeql-action/analyze@v4
              with:
                  category: /language:${{ matrix.language }}

    test:
        name: Test
        runs-on: ubuntu-slim

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Install dependencies
              run: npm ci --include=dev

            - name: Run tests
              run: npm run test

    lint:
        name: Lint
        runs-on: ubuntu-slim

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Install dependencies
              run: npm ci --include=dev

            - name: Run linting
              run: npm run lint
